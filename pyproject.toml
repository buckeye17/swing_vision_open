[project]
name = "swingvision"
version = "0.0.1"
description = "Personal, local-first tennis video analysis (practice + match) on an NVIDIA GPU."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # UI
    "dash>=3.0",
    "dash-mantine-components>=2.0",
    "dash-iconify>=0.1.2",
    "plotly>=6.0",
    # data / config
    "pyarrow>=18",
    "numpy>=2.0",
    "pydantic>=2.8",
    "platformdirs>=4.2",
    # CLI / infra
    "typer>=0.12",
    "loguru>=0.7",
    "filelock>=3.15",
    "psutil>=6.0",
    # audio
    "librosa>=0.10.2",
    "soundfile>=0.12",
    # CV / GPU
    "torch>=2.7",
    "torchvision>=0.22",
    "ultralytics>=8.3",
    "av>=14.0",
    "opencv-python>=4.10",
    "transformers>=4.48",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# NVDEC decode straight to GPU tensors (evaluated in the M0 decode spike).
nvdec = ["pynvvideocodec>=1.0"]

[project.scripts]
sv = "swingvision.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swingvision"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pandas".msg = "Project code uses PyArrow tables only (PLAN.md §5.1)."
"polars".msg = "Project code uses PyArrow tables only (PLAN.md §5.1)."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ffmpeg: needs ffmpeg/ffprobe on PATH",
    "gpu: needs an NVIDIA GPU",
]
